# HPA：1C1G 環境，min=1、max=2
# CPU request 150m，門檻 70% = 105m 絕對觸發點
# 記憶體 limits 已調低（768Mi），實際用量約 350Mi，雙 worker 安全
# scaleUp 立即、scaleDown 90s 穩定視窗
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laravel-worker
  namespace: pi-k3s
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laravel-worker
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 90
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
