services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-k3s:latest
    container_name: pi-k3s-app
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_NAME: "Pi Calculator"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:PLEASE_GENERATE_KEY}
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr

      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: pi_k3s
      DB_USERNAME: ${DOCKER_DB_USERNAME:-pi_k3s}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in your local .env}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      AUTO_MIGRATE: "true"
    volumes:
      - storage:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: pi-k3s:latest
    container_name: pi-k3s-worker
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_NAME: "Pi Calculator"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:PLEASE_GENERATE_KEY}
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr

      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: pi_k3s
      DB_USERNAME: ${DOCKER_DB_USERNAME:-pi_k3s}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in your local .env}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      AUTO_MIGRATE: "false"
      CONTAINER_ROLE: worker
    volumes:
      - storage:/var/www/html/storage
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: pi-k3s-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Set DOCKER_DB_ROOT_PASSWORD in your local .env}
      MARIADB_DATABASE: pi_k3s
      MARIADB_USER: ${DOCKER_DB_USERNAME:-pi_k3s}
      MARIADB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in your local .env}
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: pi-k3s-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  storage:
    driver: local
  mariadb-data:
    driver: local
